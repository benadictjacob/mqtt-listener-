services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms-local-pass
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -d bms"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bms:bms-local-pass@postgres:5432/bms
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:8000:8000"

  # Public website: the built frontend plus a /api proxy. Only started with
  # COMPOSE_PROFILES=web (servers); locally the Vite dev server is used instead.
  # WEB_MODE=http serves plain HTTP; WEB_MODE=https needs DOMAIN and a
  # certificate from the certbot service (see README).
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["web"]
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/${WEB_MODE:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./web/app.locations:/etc/nginx/conf.d/app.locations:ro
      - ./web/certbot-www:/var/www/certbot:ro
      - ./web/letsencrypt:/etc/letsencrypt:ro
    # Reload every 6h so renewed certificates are picked up without a restart.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]

  # Renews the Let's Encrypt certificate twice a day (a no-op until it is near expiry).
  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    profiles: ["tls"]
    volumes:
      - ./web/certbot-www:/var/www/certbot
      - ./web/letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"]

  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - ./mosquitto-data:/mosquitto/data
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]

  capture:
    build: ./capture
    restart: unless-stopped
    env_file: .env
    depends_on:
      broker:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bms:bms-local-pass@postgres:5432/bms
    volumes:
      - ./captures:/app/captures
