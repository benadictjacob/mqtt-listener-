# Serves the built frontend (web/dist) and forwards /api to the API container,
# so the browser talks to a single origin and the API port stays private.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/admin/dashboard, ...) all load the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
